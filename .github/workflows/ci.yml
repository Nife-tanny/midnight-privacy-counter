name: CI

# Compiles the contract and runs its unit tests on every push/PR. Deliberately
# scoped to what needs no secrets or live network: compiling contracts/counter.compact
# and running tests/*.test.ts against the local Compact simulator. Deploying to
# a network (npm run setup / deploy) needs a funded wallet and is not run here.

on:
  push:
  pull_request:

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pin Compact compiler version
        run: compact update "$(cat .compact-version)"

      - name: Install dependencies
        run: npm ci

      - name: Compile contract
        run: npm run compile

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test
